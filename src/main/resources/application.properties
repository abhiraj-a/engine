spring.application.name=Engine
spring.r2dbc.url=${R2BC_URL}
spring.r2dbc.username=${R2BC_USERNAME}
spring.r2dbc.password=${R2BC_PASSWORD}

# R2DBC connection pool settings (Neon free tier can be slow to wake)
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=PT30M
spring.r2dbc.pool.max-create-connection-time=PT30S

# Debug logging for R2DBC connection issues
logging.level.io.r2dbc.postgresql=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.pool=DEBUG

engine.cluster.nodes=${ENGINE_CLUSTER_NODES}

frontend.url=${FRONTEND_URL}